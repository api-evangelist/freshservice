aid: freshservice
name: Freshservice
description: >-
  Freshservice is Freshworks' cloud-based IT service management (ITSM) and
  enterprise service management platform, covering ticketing, problem, change
  and release management, asset and configuration management, and a
  self-service portal. The Freshservice REST API provides JSON-over-HTTP
  access to tickets, problems, changes, assets, agents, requesters, and the
  service catalog for ITSM automation and integration.
