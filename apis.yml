    name: Freshservice API v2
    description: >-
      REST API providing JSON-over-HTTP access to tickets, conversations,
      problems, changes, releases, assets, software, agents, requesters,
      groups, the service catalog, and approvals. Uses HTTP Basic
      authentication with a personal API key.
    humanURL: https://api.freshservice.com/
