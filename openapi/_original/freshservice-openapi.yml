components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: integer, format: int64 }
    Page:
      in: query
      name: page
      schema: { type: integer, default: 1 }
    PerPage:
      in: query
      name: per_page
      schema: { type: integer, default: 30, maximum: 100 }
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic with API key as username and "X" as password.
  schemas:
    Object:
      type: object
      additionalProperties: true
  responses:
    Ok:
      description: Successful response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Object" }
