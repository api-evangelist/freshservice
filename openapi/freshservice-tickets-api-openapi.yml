openapi: 3.2.0
info:
  title: Freshservice API v2 Tickets API
  version: v2
  description: 'Best-effort OpenAPI 3.1 description of the Freshservice ITSM REST API v2.

    Generated from public documentation; not an official spec.'
  contact:
    name: Freshservice Developer Portal
    url: https://api.freshservice.com/
servers:
- url: https://{domain}.freshservice.com/api/v2
  variables:
    domain:
      default: example
      description: Freshservice account subdomain
security:
- basicAuth: []
tags:
- name: Tickets
paths:
  /tickets:
    get:
      tags:
      - Tickets
      operationId: listTickets
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
      summary: List tickets
      x-summary-source: derived
    post:
      tags:
      - Tickets
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Object'
      responses:
        '201':
          $ref: '#/components/responses/Ok'
      summary: Create ticket
      x-summary-source: derived
  /tickets/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      tags:
      - Tickets
      operationId: getTicket
      responses:
        '200':
          $ref: '#/components/responses/Ok'
      summary: Get ticket
      x-summary-source: derived
    put:
      tags:
      - Tickets
      operationId: updateTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Object'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
      summary: Update ticket
      x-summary-source: derived
    delete:
      tags:
      - Tickets
      operationId: deleteTicket
      responses:
        '204':
          description: No Content
      summary: Delete ticket
      x-summary-source: derived
components:
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
    PerPage:
      in: query
      name: per_page
      schema:
        type: integer
        default: 30
        maximum: 100
    Page:
      in: query
      name: page
      schema:
        type: integer
        default: 1
  responses:
    Ok:
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Object'
  schemas:
    Object:
      type: object
      additionalProperties: true
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 'HTTP Basic with API key as username and "X" as password.

        '
